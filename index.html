<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>CODLONT | Connect Wallet</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="brand">
            <span class="brand-name">CODLONT</span>
        </div>
    </header>

    <main class="main-container">

        <section class="wallet-card">

            <h1>Connect your wallet</h1>

            <p class="description">
                Connect your Trust Wallet to continue to Codlont.
            </p>

            <button id="connectButton" class="connect-button" type="button">
                Connect Trust Wallet
            </button>

            <p id="status" class="status" role="status" aria-live="polite">
                Your wallet is not connected.
            </p>

            <div class="security-notice">
                <span class="security-icon">🔒</span>

                <p>
                    Your wallet credentials remain private.
                    Never share your recovery phrase or private keys.
                </p>
            </div>

        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Codlont. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
