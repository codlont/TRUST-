<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>CODLONT | Connect Wallet</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="brand">

            <!-- CODLONT SHIELD LOGO -->
            <div class="brand-icon">
                <svg
                    viewBox="0 0 48 48"
                    width="42"
                    height="42"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-label="Codlont shield logo"
                    role="img"
                >
                    <path
                        d="M24 2 L44 10 V24
                           C44 35 36 43 24 47
                           C12 43 4 35 4 24
                           V10 Z"
                        fill="#3375BB"
                    />

                    <path
                        d="M24 9 L37 15 V24
                           C37 31 32 37 24 40
                           C16 37 11 31 11 24
                           V15 Z"
                        fill="#FFFFFF"
                    />
                </svg>
            </div>

            <span class="brand-name">CODLONT</span>

        </div>
    </header>


    <main class="main-container">

        <section class="wallet-card">

            <div class="card-icon">
                <svg
                    viewBox="0 0 48 48"
                    width="54"
                    height="54"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <path
                        d="M24 3 L43 11 V24
                           C43 35 35 42 24 46
                           C13 42 5 35 5 24
                           V11 Z"
                        fill="#3375BB"
                    />

                    <path
                        d="M24 11 L35 16 V24
                           C35 31 30 36 24 39
                           C18 36 13 31 13 24
                           V16 Z"
                        fill="#FFFFFF"
                    />
                </svg>
            </div>

            <h1>Connect your wallet</h1>

            <p class="description">
                Connect your Trust Wallet to continue to Codlont.
            </p>

            <button id="connectButton" class="connect-button" type="button">
                Connect Trust Wallet
            </button>

            <p id="status" class="status" role="status" aria-live="polite">
                Your wallet is not connected.
            </p>

            <div class="security-notice">
                <span class="security-icon">🔒</span>

                <p>
                    Your wallet credentials remain private.
                    Never share your recovery phrase or private keys.
                </p>
            </div>

        </section>

    </main>


    <footer class="footer">
        <p>© 2026 Codlont. All rights reserved.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
