
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Continue</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div class="header-content">
      <span class="header-title">Continue</span>
      <span class="secure-label">Name submission</span>
    </div>
  </header>

  <main class="main-container">

    <section class="wallet-card" id="formSection">

      <div class="wallet-icon">
        <svg viewBox="0 0 64 64" role="img" aria-label="Wallet icon">
          <rect x="8" y="15" width="48" height="36" rx="7" fill="#3375BB"/>
          <path d="M8 23h48" stroke="white" stroke-width="3"/>
          <rect x="36" y="29" width="20" height="13" rx="4" fill="#ffffff"/>
          <circle cx="42" cy="35.5" r="2" fill="#3375BB"/>
        </svg>
      </div>

      <h1>Continue</h1>

      <p class="description">
        Enter your name to continue.
      </p>

      <form id="nameForm">
        <input
          type="text"
          id="nameInput"
          class="name-input"
          placeholder="Enter your name"
          maxlength="80"
          autocomplete="name"
          required
        >

        <button type="submit" class="connect-button">
          Continue
        </button>
      </form>

      <p id="status" class="status">
        Ready for submission.
      </p>

      <div class="security-notice">
        <span class="security-icon">✓</span>
        <div>
          <strong>Your security matters</strong>
          <p>Never share your wallet recovery phrase or private keys.</p>
        </div>
      </div>

    </section>

    <section class="wallet-card" id="loadingScreen" hidden>
      <h2>Submission Processing...</h2>
      <p>Please wait while you are redirected.</p>
    </section>

  </main>

  <footer class="footer">
    <p>Continue to the official Trust Wallet website</p>
  </footer>

  <script>
    const form = document.getElementById("nameForm");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("nameInput").value.trim();

      if (!name) {
        return;
      }

      document.getElementById("formSection").hidden = true;
      document.getElementById("loadingScreen").hidden = false;

      setTimeout(function() {
        window.location.assign("https://trustwallet.com/");
      }, 3000);
    });
  </script>

</body>
</html>
