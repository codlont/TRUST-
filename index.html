
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Wallet | Codlont</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="brand">

      <!-- Original Codlont shield logo -->
      <div class="brand-icon">
        <svg viewBox="0 0 48 48" width="42" height="42"
             fill="none" xmlns="http://www.w3.org/2000/svg">

          <path d="M24 2L44 11V24C44 35 35 43 24 47
                   C13 43 4 35 4 24V11L24 2Z"
                fill="#3375BB"/>

          <path d="M24 9L37 15V24C37 31 31 37 24 40
                   C17 37 11 31 11 24V15L24 9Z"
                fill="white"/>

          <path d="M29 17C26 14 20 15 17 19
                   C14 23 16 29 20 31
                   C23 33 27 32 30 29
                   L26 26C24 28 21 27 21 24
                   C21 21 24 20 26 22Z"
                fill="#3375BB"/>

        </svg>
      </div>

      <span>CODLONT</span>
    </div>
  </header>

  <main class="container">
    <div class="wallet-card">

      <div class="wallet-icon">
        <svg viewBox="0 0 48 48" width="52" height="52"
             fill="none" xmlns="http://www.w3.org/2000/svg">

          <path d="M24 3L42 11V23C42 34 34 42 24 46
                   C14 42 6 34 6 23V11L24 3Z"
                fill="#3375BB"/>

          <path d="M24 10L35 15V23C35 30 30 35 24 38
                   C18 35 13 30 13 23V15L24 10Z"
                fill="white"/>

        </svg>
      </div>

      <h1>Connect your wallet</h1>

      <p class="description">
        Connect your Trust Wallet to continue to Codlont.
      </p>

      <button id="connectButton" class="connect-button">
        Connect Trust Wallet
      </button>

      <div id="status" class="status" aria-live="polite">
        Secure wallet connection
      </div>

      <p class="security">
        Your wallet credentials remain private.
      </p>

    </div>
  </main>

  <footer>
    © 2026 Codlont. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
