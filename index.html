<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Trust Wallet | Trust Wallet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="brand">
      <div class="brand-icon">C</div>
      <span>Trust Wallet</span>
    </div>
  </header>

  <main class="container">
    <div class="wallet-card">

      <div class="wallet-icon">
        <svg viewBox="0 0 48 48" width="52" height="52"
             fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 3L42 11V23C42 34 34 42 24 46C14 42 6 34 6 23V11L24 3Z"
                fill="#3375BB"/>
          <path d="M24 10L35 15V23C35 30 30 35 24 38C18 35 13 30 13 23V15L24 10Z"
                fill="white"/>
        </svg>
      </div>

      <h1>Connect your wallet</h1>

      <p class="description">
        Connect your Trust Wallet to continue to Trust Wallet.
      </p>

      <button id="connectButton" class="connect-button">
        Connect Trust Wallet
      </button>

      <div id="status" class="status" aria-live="polite">
        Secure wallet connection
      </div>

      <p class="security">
        Your recovery phrase and private keys are never requested.
      </p>

    </div>
  </main>

  <footer>
    © 2026 Trust Wallet. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
